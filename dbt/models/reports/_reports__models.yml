version: 2

# M6. Cross-source reconciliation: where do the providers disagree, and is it a defect
# or a difference of definition? One row per check and entity.
models:
  - name: rpt_reconciliation
    columns:
      - name: check_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [match_score, team_shots, player_goals, player_cards]
      - name: match_key
        data_tests: [not_null]
      - name: entity_key
        description: team_key or player_key, depending on the check (match_key for match_score).
        data_tests: [not_null]
      - name: statsbomb_value
      - name: transfermarkt_value
      - name: football_data_value
      - name: is_match
        description: True when every source that has the value agrees.
        data_tests: [not_null]
    data_tests:
      - expected_rows:
          arguments:
            columns: [check_name]
            rows: [[match_score], [team_shots], [player_goals], [player_cards]]
      - expression_is_true:
          arguments: {expression: "check_name <> 'match_score' or is_match"}
