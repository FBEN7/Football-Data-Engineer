version: 2

# M1. Every lake column is text: dates are dd/mm/yyyy, numbers need casting.
models:
  - name: stg_football_data__matches
    description: One row per Bundesliga 2023/24 match with result, match stats and average odds.
    data_tests:
      - row_count:
          arguments: {min: 306, max: 306}
    columns:
      - name: match_key
        description: Stable key you choose, e.g. date + home team. Must be unique.
        data_tests: [unique, not_null]
      - name: match_date
        description: DATE, parsed from dd/mm/yyyy.
        data_tests:
          - not_null
          - accepted_range:
              arguments: {min: "'2023-08-01'", max: "'2024-06-30'"}
      - name: home_team
        data_tests: [not_null]
      - name: away_team
        data_tests: [not_null]
      - name: home_goals
        data_tests: [not_null]
      - name: away_goals
        data_tests: [not_null]
      - name: home_shots
      - name: away_shots
      - name: home_shots_on_target
      - name: away_shots_on_target
      - name: home_yellow_cards
      - name: away_yellow_cards
      - name: home_red_cards
      - name: away_red_cards
      - name: odds_home_avg
        description: Market average decimal odds (football-data column AvgH).
        data_tests:
          - accepted_range:
              arguments: {min: 1}
      - name: odds_draw_avg
      - name: odds_away_avg
