name: ci

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Transfermarkt needs a Kaggle token: either a new-style API token (KAGGLE_API_TOKEN)
      # or a legacy kaggle.json pair (KAGGLE_USERNAME + KAGGLE_KEY), as repository secrets.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: sources-${{ hashFiles('src/cdp/config.py') }}
      - name: Ingest StatsBomb and football-data
        run: python -m cdp ingest --source statsbomb --source football_data
      - name: Ingest Transfermarkt (skipped when no Kaggle secret is set)
        if: env.KAGGLE_API_TOKEN != '' || env.KAGGLE_KEY != ''
        run: python -m cdp ingest --source transfermarkt
      - name: dbt build (every enabled milestone, with its tests)
        run: python -m cdp dbt build
      - run: pytest -q
      - name: Upload built warehouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdp-built-data
          path: |
            data/lake
            data/warehouse.duckdb
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t club-data-platform .
